name: Semippu APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semippu-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and the APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set +e
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            echo "=== Errors ==="
            grep -E '^e: |error:|FAILED|What went wrong' -A2 build.log | sed 's|file:///home/runner/work/semippu/semippu/app/src/main/java/io/github/akrishna87/semippu/||' | tail -120
          fi
          exit $status
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Semippu.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Semippu-apk
          path: Semippu.apk

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Semippu-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and run on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash ci/smoke-test.sh apk/Semippu.apk smoke-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semippu-smoke-test-screens
          path: smoke-out

  publish:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # A branch whose app is the same as main's (a new branch for other work, say) mustn't
      # replace the download with an older build of the app than the one being worked on.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this build change the app?
        id: changes
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] && git diff --quiet origin/main HEAD; then
            echo "The app on this branch is the same as on main; not publishing."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.changes.outputs.publish == 'true'
        with:
          name: Semippu-apk
          path: out
      - uses: actions/download-artifact@v4
        if: steps.changes.outputs.publish == 'true'
        with:
          name: semippu-smoke-test-screens
          path: smoke
      - name: Publish the APK as the "semippu-latest" release
        if: steps.changes.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p out/screens
          cp smoke/*.png out/screens/ 2>/dev/null || true
          apk=out/Semippu.apk
          cat > out/version.json <<JSON
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "apk": "Semippu.apk",
            "sha256": "$(sha256sum "$apk" | cut -d' ' -f1)",
            "size": $(stat -c %s "$apk")
          }
          JSON
          gh release delete semippu-latest --cleanup-tag --yes || true
          gh release create semippu-latest "$apk" out/version.json out/screens/*.png \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Semippu for Android (build ${{ github.run_number }})" \
            --notes "Download **Semippu.apk** on your Android phone, open it, and allow installing from your browser when asked. Each new build installs as an update over the last one. The PNG files are screenshots from the automatic emulator test of this build."
